[workspace]
channels = ["https://prefix.dev/brads-forge", "conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64", "linux-aarch64"]

[dependencies]
task = ">=3.54.0,<4"
dprint = ">=0.64.3,<0.65"
rustup = ">=1.29.3,<2"
lefthook = ">=2.2.2,<3"
cocogitto = ">=7.0.0,<8"
apm = ">=0.35.0,<0.36"
bun = ">=1.4.4,<2"
devbox = ">=0.0.213,<0.0.214"
nsc = ">=0.0.595,<0.0.596"

[target.linux.dependencies]
avr = ">=0.8.0,<0.9"

[target.unix.activation.env]
PATH = "$PIXI_PROJECT_ROOT/scripts:$PATH"
USER_MEMORY_FILE_PATH = "$HOME/.config/mcp-memory/memory.jsonl"

[target.win.activation.env]
PATH = "%PIXI_PROJECT_ROOT%\\scripts;%PATH%"
USER_MEMORY_FILE_PATH = "%USERPROFILE%\\.config\\mcp-memory\\memory.jsonl"
