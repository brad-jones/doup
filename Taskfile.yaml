# yaml-language-server: $schema=https://taskfile.dev/schema.json
# https://taskfile.dev
version: 3

dotenv: [".env"]
set: [pipefail]
shopt: [globstar]

vars:
  # Miri only ships on nightly, pinned so its results are reproducible. Not every nightly has
  # Miri, check https://rust-lang.github.io/rustup-components-history/ before bumping.
  MIRI_TOOLCHAIN: nightly-2026-11-19

tasks:
  init:
    desc: Setup dev env (anything that pixi can't install and setup for us).
    status:
      - '[ "$DIRENV_INIT" -eq "1" ]'
    cmds:
      - task: init:git
      - task: init:bun
      - task: init:lefthook
      - task: init:apm
      - task: init:rustup

  init:bun:
    desc: Install node_modules using Bun.
    sources:
      - package.json
    generates:
      - bun.lock
    cmds:
      - bun install {{if .CI}}--frozen-lockfile{{end}}

  init:git:
    desc: Setup git configuration for the project.
    sources:
      - Taskfile.yaml
    generates:
      - .git/initialized
    cmds:
      - git config pull.rebase true
      - '{{if not .CI}}git config core.editor "code --wait"{{end}}'
      - '{{if not .CI}}git config commit.template "$PWD/.gitmsgtpl"{{end}}'
      - "{{if .CI}}git config --global user.name github-actions[bot]{{end}}"
      - "{{if .CI}}git config --global user.email github-actions[bot]@users.noreply.github.com{{end}}"
      - echo "1" > .git/initialized

  init:lefthook:
    desc: Install git hooks using lefthook for the project.
    if: '[ -z "$CI" ]'
    sources:
      - ./.lefthook/**/*
      - lefthook.yaml
    generates:
      - .git/hooks/**/*
    cmds:
      - lefthook install -f

  init:apm:
    if: '[ -z "$CI" ]'
    sources:
      - ./.apm/**/*
      - apm.yml
    cmds:
      - apm install {{if .APM_TARGET}}--target {{.APM_TARGET}}{{end}}
      - apm compile --clean {{if .APM_TARGET}}--target {{.APM_TARGET}}{{end}}

  init:rustup:init:
    desc: Install and configure rustup for the project (run this once, afterwards use rustup to manage the toolchain)
    status:
      - '[ -f ".pixi/envs/default/.rustup/settings.toml" ]'
    cmds:
      - rustup-init -y --no-modify-path --default-toolchain none

  init:rustup:
    desc: Installs the Rust toolchain specified in rust-toolchain.toml
    deps:
      - init:rustup:init
    sources:
      - rust-toolchain.toml
    cmds:
      - rustup install --no-self-update
      - if: '[ -n "$TARGET" ]'
        cmd: rustup target add {{.TARGET}}

  init:miri:
    desc: Installs the pinned nightly toolchain with Miri & builds its sysroot (into $MIRI_SYSROOT).
    deps:
      - init:rustup:init
    cmds:
      - rustup toolchain install {{.MIRI_TOOLCHAIN}} --profile minimal --component miri,rust-src --no-self-update
      # Idempotent, a no-op when the sysroot is already up to date. Must be run explicitly
      # because cargo miri won't build a sysroot itself when MIRI_SYSROOT is set.
      - cargo +{{.MIRI_TOOLCHAIN}} miri setup

  update:
    desc: Interactively updates our dependencies to their latest versions.
    summary: |
      doup is a tool that we are building to do exactly what this task does but in a more structured way.
      In the future hopefully we can dog food doup but for now we need to bootstrap this process manually.
      I mean we could just use renovate or dependabot but we would end up running into the very problem
      we are trying to solve, at least I know that renovate provides no support for APM & Dprint for example.
    cmds:
      - pixi self-update
      - sync-gha-pixi-version.ts
      - pixi upgrade
      - rustup update --no-self-update
      - sync-rust-toolchain.ts
      - dprint config upgrade
      - apm update --yes
      - bunx -y actions-up --style preserve --yes

  fmt:
    desc: Format the code to ensure everything looks consistently the same and easy to read.
    cmds:
      - dprint fmt

  lint:
    desc: Lint our code base to ensure we maintain decent quality.
    deps:
      - init:rustup
    env:
      CARGO_BUILD_WARNINGS: deny
    cmds:
      - cog check
      - dprint check
      - cargo clippy

  test:
    desc: Test our code base to ensure it works as we intend.
    cmds:
      - task: test:unit
      - task: test:integration

  test:unit:
    desc: Runs the in-crate unit tests (and doc tests).
    deps:
      - init:rustup
    cmds:
      - cargo test --workspace --lib --bins
      - cargo test --workspace --doc

  test:integration:
    desc: Runs the integration tests under each crate's tests/ dir, for a given target.
    deps:
      - init:rustup
    cmds:
      - cargo test --workspace --test '*' {{if .TARGET}}--target {{.TARGET}}{{end}}

  bench:
    desc: Runs the benchmarks. Pass a name filter after `--`, eg. `task bench -- mixed`.
    deps:
      - init:rustup
    cmds:
      - cargo bench -p galvanize-rs {{if .CLI_ARGS}}-- {{.CLI_ARGS}}{{end}}

  miri:
    desc: Checks hardened inheritance and historical probes with Miri, or a supplied standalone .rs file.
    summary: |
      Without args, runs miri:main, the historical "true" inheritance spike, and the inheritance bench's
      race & verify checks (not its timed benchmarks). The old MainDesign remains known unsound;
      passing its historical happy-path checks does not endorse its public API.
      With args, eg. `task miri -- path/to/file.rs`, checks that standalone file instead.

      Everything is run under both of Miri's aliasing models (Stacked & Tree Borrows), with strict
      provenance, across several thread scheduling seeds. Extra flags can be added via MIRIFLAGS.
    deps:
      - init:miri
    cmds:
      - if: '[ -z "{{.CLI_ARGS}}" ]'
        task: miri:main
      - task: miri:run
        vars:
          CMD: run
          ARGS: '--manifest-path {{.CLI_ARGS | default "docs/research/galvanize-rs-true-inheritance-spike.rs"}}'
      - if: '[ -z "{{.CLI_ARGS}}" ]'
        task: miri:run
        vars:
          CMD: test
          ARGS: -p galvanize-rs --bench inheritance

  miri:main:
    desc: Checks the hardened runtime and generated sync/async classes under both Miri aliasing models.
    summary: |
      Runs the generated inheritance, soundness, and async integration tests with strict provenance
      and eight scheduling seeds per model. Compiler-driving UI tests and Tokio spawning run natively;
      deterministic async suspension, borrowed inputs, thread migration, and cancellation run in Miri.
      Passing checks are evidence for the written safety argument, not an exhaustive soundness proof.
    deps:
      - init:miri
    cmds:
      - task: miri:run
        vars:
          CMD: test
          ARGS: -p galvanize-rs-main-runtime -p galvanize-rs-main-models --lib --tests

  miri:run:
    internal: true
    requires:
      vars: [CMD, ARGS]
    env:
      # cargo-script lets cargo (and thus cargo miri) treat a lone .rs file as a package.
      CARGO_UNSTABLE_SCRIPT: "true"
    cmds:
      - for: ["", "-Zmiri-tree-borrows"]
        cmd: >-
          MIRIFLAGS="-Zmiri-strict-provenance -Zmiri-many-seeds=0..8 {{.ITEM}} $MIRIFLAGS"
          cargo +{{.MIRI_TOOLCHAIN}} miri {{.CMD}} -q {{.ARGS}}

  run:cli:
    desc: Runs the cli using `cargo run`.
    deps:
      - init:rustup
    cmds:
      - cargo run -p doup-cli -- {{.CLI_ARGS}}

  build:cli:
    desc: Builds the doup CLI project for a given target
    deps:
      - init:rustup
    cmds:
      - cargo build -p doup-cli --release {{if .TARGET}}--target {{.TARGET}}{{end}}

  build:plugins:
    desc: Builds the doup WASM plugins
    deps:
      - init:rustup
    cmds:
      - cargo build -p doup-ecosystem-plugin-doup --release --target wasm32-wasip2
      - cargo build -p doup-platform-plugin-github --release --target wasm32-wasip2

  run:update:
    desc: Local version of .github/workflows/update.yaml
    deps:
      - build:cli
      - build:plugins
    env:
      DOUP_BOT__GIT_BACKEND: grit
      DOUP_BOT_REPOS_0_ORIGIN: https://github.com/brad-jones/doup.git
      DOUP_BOT_REPOS_0_AUTH_USER: x-access-token
      DOUP_BOT_REPOS_0_AUTH_PASS:
        sh: gh auth token -u brad-jones
    cmds:
      - ./target/release/doup{{if eq OS "windows"}}.exe{{end}} update
