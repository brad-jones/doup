# yaml-language-server: $schema=https://taskfile.dev/schema.json
# https://taskfile.dev
version: 3

dotenv: [".env"]
set: [pipefail]
shopt: [globstar]

tasks:
  init:
    desc: Setup dev env (anything that pixi can't install and setup for us).
    status:
      - '[ "$DIRENV_INIT" -eq "1" ]'
    cmds:
      - task: init:git
      - task: init:bun
      - task: init:lefthook
      - task: init:apm
      - task: init:rustup

  init:bun:
    desc: Install node_modules using Bun.
    sources:
      - package.json
    generates:
      - bun.lock
    cmds:
      - bun install {{if .CI}}--frozen-lockfile{{end}}

  init:git:
    desc: Setup git configuration for the project.
    sources:
      - Taskfile.yaml
    generates:
      - .git/initialized
    cmds:
      - git config pull.rebase true
      - '{{if not .CI}}git config core.editor "code --wait"{{end}}'
      - '{{if not .CI}}git config commit.template "$PWD/.gitmsgtpl"{{end}}'
      - "{{if .CI}}git config --global user.name github-actions[bot]{{end}}"
      - "{{if .CI}}git config --global user.email github-actions[bot]@users.noreply.github.com{{end}}"
      - echo "1" > .git/initialized

  init:lefthook:
    desc: Install git hooks using lefthook for the project.
    if: '[ -z "$CI" ]'
    sources:
      - ./.lefthook/**/*
      - lefthook.yaml
    generates:
      - .git/hooks/**/*
    cmds:
      - lefthook install -f

  init:apm:
    if: '[ -z "$CI" ]'
    sources:
      - ./.apm/**/*
      - apm.lock.yaml
    cmds:
      - apm install {{if .APM_TARGET}}--target {{.APM_TARGET}}{{end}}
      - apm compile --clean {{if .APM_TARGET}}--target {{.APM_TARGET}}{{end}}

  init:rustup:init:
    desc: Install and configure rustup for the project (run this once, afterwards use rustup to manage the toolchain)
    status:
      - '[ -f ".pixi/envs/default/.rustup/settings.toml" ]'
    cmds:
      - rustup-init -y --no-modify-path --default-toolchain none

  init:rustup:
    desc: Installs the Rust toolchain specified in rust-toolchain.toml
    deps:
      - init:rustup:init
    sources:
      - rust-toolchain.toml
    cmds:
      - rustup install --no-self-update
      - cargo install cargo-zigbuild@0.24.0
      - cargo install cargo-xwin@0.23.1
      - cargo xwin cache xwin
      - cargo xwin cache windows-msvc-sysroot

  update:
    desc: Interactively updates our dependencies to their latest versions.
    summary: |
      doup is a tool that we are building to do exactly what this task does but in a more structured way.
      In the future hopefully we can dog food doup but for now we need to bootstrap this process manually.
      I mean we could just use renovate or dependabot but we would end up running into the very problem
      we are trying to solve, at least I know that renovate provides no support for APM & Dprint for example.
    cmds:
      - pixi self-update
      - sync-gha-pixi-version.ts
      - pixi upgrade
      - rustup update --no-self-update
      - dprint config upgrade
      - apm update --yes

  fmt:
    desc: Format the code using dprint.
    cmds:
      - dprint fmt

  lint:
    desc: Lint the code using dprint and cargo clippy.
    cmds:
      - dprint check
      - cargo clippy

  build:cli:
    desc: Builds the CLI project.
    sources:
      - ./projects/cli/**/*
    generates:
      - ./target/*/release/doup
      - ./target/*/release/doup.exe
    cmds:
      - cargo zigbuild -p cli --release --target x86_64-unknown-linux-gnu
      - cargo zigbuild -p cli --release --target x86_64-unknown-linux-musl
      - cargo zigbuild -p cli --release --target x86_64-apple-darwin
      - cargo xwin build -p cli --release --target x86_64-pc-windows-msvc
      - cargo zigbuild -p cli --release --target aarch64-unknown-linux-gnu
      - cargo zigbuild -p cli --release --target aarch64-unknown-linux-musl
      - cargo zigbuild -p cli --release --target aarch64-apple-darwin
      - cargo xwin build -p cli --release --target aarch64-pc-windows-msvc

  run:
    desc: Run the built CLI, demonstrating the basic WASM plugin architecture.
    deps:
      - build
    cmds:
      - target/debug/doup {{.CLI_ARGS}}
