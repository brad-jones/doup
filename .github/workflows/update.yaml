on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build_32x64:
    runs-on: namespace-profile-32x64
    steps:
      - name: ⬇️ Git Checkout
        uses: actions/checkout@v7

      - name: ✨ Install pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.0
          activate-environment: true

      - name: 🏗️ Build CLI
        run: task build:cli
        env:
          TARGET: x86_64-unknown-linux-gnu

      - name: 🧪 Smoke Test Binary
        run: ./target/x86_64-unknown-linux-gnu/release/doup --help

  build_ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Git Checkout
        uses: actions/checkout@v7

      - name: ✨ Install pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.0
          activate-environment: true

      - name: 🏗️ Build CLI
        run: task build:cli
        env:
          TARGET: x86_64-unknown-linux-gnu

      - name: 🧪 Smoke Test Binary
        run: ./target/x86_64-unknown-linux-gnu/release/doup --help
