on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build_github-4x16:
    runs-on: ubuntu-26.04
    steps:
      - name: ⬇️ Git Checkout
        uses: actions/checkout@v7

      - name: ✨ Install pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.0
          activate-environment: true

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.19.0"
      - run: sccache --start-server

      - name: 🏗️ Build CLI
        run: task build:cli
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: true
          TARGET: x86_64-unknown-linux-gnu

      - name: 🧪 Smoke Test Binary
        run: ./target/x86_64-unknown-linux-gnu/release/doup --help

  build_namespace-4x16:
    runs-on: namespace-profile-4x16
    steps:
      - name: ⬇️ Git Checkout
        uses: actions/checkout@v7

      - name: ✨ Install pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.0
          activate-environment: true

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.19.0"
      - run: nsc cache sccache setup --cache_name default >> "$GITHUB_ENV"
      - run: sccache --start-server

      - name: 🏗️ Build CLI
        run: task build:cli
        env:
          RUSTC_WRAPPER: sccache
          TARGET: x86_64-unknown-linux-gnu

      - name: 🧪 Smoke Test Binary
        run: ./target/x86_64-unknown-linux-gnu/release/doup --help

  build_avrea-4x16:
    runs-on: avrea-ubuntu-26.04-4-vcpu
    steps:
      - name: ⬇️ Git Checkout
        uses: actions/checkout@v7

      - name: ✨ Install pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.0
          activate-environment: true

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.19.0"
      - run: sccache --start-server

      - name: 🏗️ Build CLI
        run: task build:cli
        env:
          RUSTC_WRAPPER: sccache
          TARGET: x86_64-unknown-linux-gnu

      - name: 🧪 Smoke Test Binary
        run: ./target/x86_64-unknown-linux-gnu/release/doup --help
