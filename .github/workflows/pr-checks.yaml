name: Pull Request Checks

on:
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: avrea-ubuntu-26.04-4-vcpu
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: ⬇️ Git Checkout
        uses: actions/checkout@v7

      - name: ✨ Install pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          activate-environment: true

      - name: 💾 Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.19.0"

      - name: 👮 Lint Code Base
        run: task lint

  test:
    runs-on: avrea-ubuntu-26.04-4-vcpu
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: ⬇️ Git Checkout
        uses: actions/checkout@v7

      - name: ✨ Install pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          activate-environment: true

      - name: 💾 Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.19.0"

      - name: 🧪 Run Unit Tests
        run: task test:unit
