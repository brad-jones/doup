[package]
name = "doup-config"
version = "0.1.0"
edition = "2024"
description = "Loads and validates doup's bot and per-repo configuration files."

[dependencies]
jsonschema = { version = "0.61.2", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.0"
serde_json = "1.0.154"
ssh-key = "0.6.7"
thiserror = "2.0.21"

[dev-dependencies]
assert_fs = "1.1.4"
