[package]
name = "doup-config-2"
version = "0.1.0"
edition = "2024"
description = "Loads and validates doup's bot and per-repo configuration files."

[dependencies]
anyhow = "1.0.104"
galvanize-rs = { path = "../galvanize-rs" }
jsonschema = { version = "0.61.0", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.0"
serde_json = "1.0.154"
ssh-key = "0.6.7"

[dev-dependencies]
assert_fs = "1.1.4"
