[package]
name = "doup-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "doup"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
doup-config = { path = "../config" }
doup-git = { path = "../git" }
doup-plugin-host = { path = "../plugins/host" }
nutype = "0.8.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"
