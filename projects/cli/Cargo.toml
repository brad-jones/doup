[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "doup"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
regress = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tokio = { version = "1.54.1", features = ["full"] }
typify = "0.8.0"
wasmtime = "50.0.0"
wasmtime-wasi = "50.0.0"
