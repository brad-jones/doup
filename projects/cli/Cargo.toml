[package]
name = "doup-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "doup"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.10", features = ["derive"] }
doup-config = { path = "../config" }
doup-core = { path = "../core" }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"
