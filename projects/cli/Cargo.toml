[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "doup"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jsonschema = { version = "0.61.0", features = ["macros"] }
regress = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.0"
serde_json = "1.0.154"
ssh-key = "0.6.7"
tokio = { version = "1.54.1", features = ["full"] }
wasmtime = "50.0.0"
wasmtime-wasi = "50.0.0"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"
