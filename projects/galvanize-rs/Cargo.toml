[package]
name = "galvanize-rs"
version = "0.1.0"
categories = ["rust-patterns", "memory-management"]
edition = "2024"
keywords = ["ergonomics", "framework", "smart-pointers", "gc", "high-level"]
description = "Write Rust like a higher-level language. Trades runtime performance for a simpler model without the borrow checker pain."

[dependencies]
arc-swap = "1.9.5"
galvanize-rs-macros = { path = "macros" }

[dev-dependencies]
divan = "0.1.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
trybuild = "1.0.125"

[[bench]]
name = "pointers"
harness = false
