[package]
name = "galvanize-rs-macros"
version = "0.1.0"
categories = ["rust-patterns"]
edition = "2024"
keywords = ["ergonomics", "framework", "class", "macro"]
description = "Procedural macros for galvanize-rs. Use them via the galvanize-rs crate."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }

[dev-dependencies]
galvanize-rs = { path = ".." }
