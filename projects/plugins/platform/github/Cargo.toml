[package]
name = "doup-platform-plugin-github"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
garde = { version = "0.23.0", features = ["derive", "regex"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
wasi-fetch = "0.2.0"
wit-bindgen = { version = "0.63", features = ["async"] }
