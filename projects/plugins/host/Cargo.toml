[package]
name = "doup-plugin-host"
version = "0.1.0"
edition = "2024"
description = "Loads and runs doup's WASM plugins using wasmtime."

[dependencies]
anyhow = "1.0.104"
doup-config = { path = "../../config" }
http = "1"
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde_json = "1.0.154"
wasmtime = "50.0.0"
wasmtime-wasi = "50.0.0"
wasmtime-wasi-http = { version = "50.0.0", default-features = false, features = ["p2", "default-send-request"] }
