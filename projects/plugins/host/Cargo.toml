[package]
name = "doup-plugin-host"
version = "0.1.0"
edition = "2024"
description = "Loads and runs doup's WASM plugins using wasmtime."

[dependencies]
anyhow = "1.0.104"
doup-config = { path = "../../config" }
doup-plugin-macro = { path = "../macro" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync"] }
wasmtime = "50.0.0"
wasmtime-wasi = "50.0.0"

[dev-dependencies]
assert_fs = "1.1.4"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
