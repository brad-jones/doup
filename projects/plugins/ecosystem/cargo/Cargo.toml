[package]
name = "doup-ecosystem-plugin-cargo"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
garde = { version = "0.23.0", features = ["derive", "regex"] }
ignore = "0.4.35"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
toml_edit = "0.25.21"
wasi-fetch = "0.2.0"
wit-bindgen = { version = "0.63", features = ["async"] }

[dev-dependencies]
tempfile = "3.27.0"
