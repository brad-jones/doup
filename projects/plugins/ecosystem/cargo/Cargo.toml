[package]
name = "doup-ecosystem-plugin-cargo"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
ignore = "0.4.35"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
