[package]
name = "doup-git"
version = "0.1.0"
edition = "2024"
description = "Abstracts the Git operations doup needs behind a swappable backend."

[dependencies]
base64 = "0.23.1"
doup-config = { path = "../config" }
doup-plugin-host = { path = "../plugins/host" }
gix-validate = "0.13.2"
grit-lib = { version = "0.5.33", features = ["http-ureq"] }
rsa = { version = "0.9.10", features = ["getrandom", "sha2"] }
sha2 = "0.10.9"
shlex = "2.0.1"
spire_enum = "1.2.0"
ssh-agent-lib = "0.6.0"
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "p384", "p521", "rsa"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "net", "process", "rt"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
