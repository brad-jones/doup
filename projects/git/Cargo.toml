[package]
name = "git"
version = "0.1.0"
edition = "2024"
description = "Abstracts the Git operations doup needs behind a swappable backend."

[dependencies]
base64 = "0.23.1"
grit-lib = { version = "0.5.33", features = ["http-ureq"] }
rsa = { version = "0.9.10", features = ["getrandom", "sha2"] }
shlex = "2.0.1"
ssh-agent-lib = "0.6.0"
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "p384", "p521", "rsa"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "net", "process", "rt"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
